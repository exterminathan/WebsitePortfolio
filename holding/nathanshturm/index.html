  <style>
    :root {
      --bg: #f5f1ef;
      --ink: #1e1618;
      --dim: #6a5f61;
      --line: rgba(30, 22, 24, 0.16);
      --red: #e0233f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0909; --ink: #ece8e9; --dim: #8f8585; --line: rgba(236, 232, 233, 0.16); --red: #fc314f; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: 1fr auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
    }
    main { display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; padding-block: 40px; }
    .lockup { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 18px; }
    .mark { width: clamp(64px, 14vw, 96px); height: auto; color: var(--ink); overflow: visible; }
    .mark-accent { fill: var(--red); }
    .mark-accent-s { stroke: var(--red); }
    .mark .lid { transform-origin: 32px 32px; }
    .mark .lid.blink { animation: blink 0.3s ease-in-out; }
    h1 { margin: 0; font-weight: 600; font-size: clamp(2rem, 6.5vw, 3.2rem); letter-spacing: -0.03em; line-height: 1.05; }
    .soon { margin: 0; color: var(--dim); font-size: 1.05rem; }
    .resume {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 999px;
      border: 1px solid var(--red); color: var(--red);
      font-weight: 600; text-decoration: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .resume:hover { background: var(--red); color: #fff; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; max-width: 34rem; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.82rem; }
    .links a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }
    .links a:hover { color: var(--red); border-color: currentColor; }
    footer { padding: 24px 0 28px; text-align: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8rem; color: var(--dim); }
    @keyframes blink {
      0%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.08); }
    }
  </style>

  <script>
    const ids = ['c01', 'c02', 'c03', 'c04', 'c05', 'c06', 'c07', 'c08', 'c09', 'c10', 'c11', 'c12', 'c13', 'c14', 'c15', 'c16', 'c17', 'c18', 'c19', 'c20', 'c21', 'c22', 'c23', 'c24', 'c25', 'c26', 'c27', 'c28', 'c29', 'c30', 'c31', 'c32', 'c33', 'c34', 'c35', 'c36', 'c37', 'c38', 'c39', 'c40', 'c41'];
    const pick = ids[Math.floor(Math.random() * ids.length)];
    document.getElementById('mark-use').setAttribute('href', '#' + pick);

    if (pick === 'c41') {
      const lid = document.querySelector('.mark .lid');
      const rand = (a, b) => a + Math.random() * (b - a);
      const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 2 : 1;
      let blinking = false, timer;
      let pressure = 0, threshold = rand(18, 36), lastClick = performance.now();

      const blink = () => {
        if (blinking) return;
        blinking = true;
        lid.classList.add('blink');
      };
      lid.addEventListener('animationend', () => { lid.classList.remove('blink'); blinking = false; });

      const idle = () => {
        clearTimeout(timer);
        timer = setTimeout(() => { blink(); idle(); }, rand(15000, 35000) * calm);
      };

      document.addEventListener('pointerdown', () => {
        const now = performance.now();
        pressure = Math.max(0, pressure - (now - lastClick) / 1000 * 0.4) + rand(0.4, 1.6);
        lastClick = now;
        if (pressure >= threshold) {
          pressure = 0;
          threshold = rand(18, 36);
          blink();
          idle();
        }
      });

      idle();
    }
  </script>
